apiVersion: v1
kind: ServiceAccount
metadata:
  name: schemashift-backend-sa
  namespace: schemashift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-pod-manager
  namespace: schemashift-sandboxes
rules:
  - apiGroups: ["", "batch"]
    resources: ["pods", "pods/log", "pods/exec", "jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-sandbox-pod-manager
  namespace: schemashift-sandboxes
subjects:
  - kind: ServiceAccount
    name: schemashift-backend-sa
    namespace: schemashift
roleRef:
  kind: Role
  name: sandbox-pod-manager
  apiGroup: rbac.authorization.k8s.io

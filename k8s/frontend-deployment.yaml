apiVersion: apps/v1
kind: Deployment
metadata:
  name: schemashift-frontend
  namespace: schemashift
  labels:
    app: schemashift-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: schemashift-frontend
  template:
    metadata:
      labels:
        app: schemashift-frontend
    spec:
      containers:
        - name: frontend
          image: schemashift/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: schemashift-frontend-svc
  namespace: schemashift
spec:
  selector:
    app: schemashift-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schemashift-ingress
  namespace: schemashift
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: schemashift-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: schemashift-frontend-svc
                port:
                  number: 3000
